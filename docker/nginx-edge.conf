# Nginx de Borda (Nó Barco) — SCRUM-20
# Template processado pelo envsubst da imagem oficial (/etc/nginx/templates).
# Variáveis: NGINX_RESOLVER, CAPTAIN_PANEL_UPSTREAM, EDGE_API_UPSTREAM, CSP_SCRIPT_EXTRA
#
#   /            -> Painel do Capitão (Next.js :3000)
#   /api/edge/*  -> API REST local do NestJS (:3002), sem o prefixo /api/edge

include /etc/nginx/snippets/common-http.conf;

# proxy_pass via variável + resolver: o Nginx sobe mesmo sem os upstreams prontos
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

map $host $ferry_node { default "edge"; }

limit_req_zone $binary_remote_addr zone=edge_api:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  access_log /var/log/nginx/access.log ferry_json;

  include /etc/nginx/snippets/security-headers.conf;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' ${CSP_SCRIPT_EXTRA}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  include /etc/nginx/snippets/api-error-locations.conf;

  location /api/edge/ {
    limit_req zone=edge_api burst=40 nodelay;
    include /etc/nginx/snippets/api-errors.conf;
    include /etc/nginx/snippets/proxy-common.conf;

    set $edge_api ${EDGE_API_UPSTREAM};
    rewrite ^/api/edge/(.*)$ /$1 break;
    proxy_pass $edge_api;
  }

  location / {
    include /etc/nginx/snippets/proxy-common.conf;

    set $captain_panel ${CAPTAIN_PANEL_UPSTREAM};
    proxy_pass $captain_panel;
  }
}
