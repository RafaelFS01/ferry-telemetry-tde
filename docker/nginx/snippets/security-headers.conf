# Cabeçalhos de segurança comuns (contexto server).
# A CSP fica em cada arquivo de site, pois as origens permitidas mudam entre borda e central.
# Atenção: um add_header dentro de location descarta estes; por isso nenhuma location usa add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Request-ID $request_id always;
