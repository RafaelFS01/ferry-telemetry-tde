# Locations nomeadas usadas por api-errors.conf (contexto server).
location @api_unavailable {
  default_type application/json;
  return 503 '{"error":"upstream_unavailable","request_id":"$request_id"}';
}

location @api_rate_limited {
  default_type application/json;
  return 429 '{"error":"rate_limited","request_id":"$request_id"}';
}

location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}
