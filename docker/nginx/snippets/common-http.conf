# Definições compartilhadas de contexto http, incluídas no topo de cada site.
include /etc/nginx/snippets/log-format.conf;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

server_tokens off;
limit_req_status 429;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
