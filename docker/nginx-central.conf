# Nginx do Nó Central — SCRUM-20
# Template processado pelo envsubst da imagem oficial (/etc/nginx/templates).
# Variáveis: NGINX_RESOLVER, DASHBOARD_UPSTREAM, CENTRAL_API_UPSTREAM, CSP_SCRIPT_EXTRA
#
#   /       -> Dashboard Cartográfico (Next.js :3000)
#   /api/*  -> API REST da Central em Python (:8000), caminho preservado

include /etc/nginx/snippets/common-http.conf;

# proxy_pass via variável + resolver: o Nginx sobe mesmo sem os upstreams prontos
resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

map $host $ferry_node { default "central"; }

limit_req_zone $binary_remote_addr zone=central_api:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  access_log /var/log/nginx/access.log ferry_json;

  include /etc/nginx/snippets/security-headers.conf;
  # Tiles do mapa vêm do OpenStreetMap (base) e OpenSeaMap (marcas náuticas)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' ${CSP_SCRIPT_EXTRA}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tiles.openseamap.org; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  include /etc/nginx/snippets/api-error-locations.conf;

  location /api/ {
    limit_req zone=central_api burst=60 nodelay;
    include /etc/nginx/snippets/api-errors.conf;
    include /etc/nginx/snippets/proxy-common.conf;

    set $central_api ${CENTRAL_API_UPSTREAM};
    proxy_pass $central_api;
  }

  location / {
    include /etc/nginx/snippets/proxy-common.conf;

    set $dashboard ${DASHBOARD_UPSTREAM};
    proxy_pass $dashboard;
  }
}
