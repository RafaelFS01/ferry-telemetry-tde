name: CD Central (ECS)
# Publica as imagens do Nó Central no ECR e atualiza os serviços ECS (SCRUM-24).
# Autenticação via OIDC: o papel ferry-github-deploy só aceita a branch main.
on:
  push:
    branches: [main]
    paths:
      - ferry-central
      - proto/**
      - docker/prod/central.Dockerfile
      - .github/workflows/cd-central-deploy.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: cd-central
  cancel-in-progress: false
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}

jobs:
  deploy:
    name: Deploy ${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ingestion
            module: server
          - component: worker
            module: worker
    env:
      FAMILY: ferry-central-${{ matrix.component }}-${{ vars.DEPLOY_ENVIRONMENT || 'prod' }}
      CONTAINER: ferry-central-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Verifica ponto de entrada
        id: entry
        run: |
          if [ -f "ferry-central/src/${{ matrix.module }}/main.py" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ferry-central/src/${{ matrix.module }}/main.py ainda não existe; deploy de ${{ matrix.component }} ignorado"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.entry.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - if: steps.entry.outputs.ready == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - if: steps.entry.outputs.ready == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.entry.outputs.ready == 'true'
        name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ferry-central
          file: docker/prod/central.Dockerfile
          target: ${{ matrix.component }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ferry-central-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=central-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=central-${{ matrix.component }}
      - if: steps.entry.outputs.ready == 'true'
        name: Task definition atual
        run: |
          # O Terraform cria a task com um "command" provisório; a imagem real usa o CMD do Dockerfile
          aws ecs describe-task-definition --task-definition "$FAMILY" --query taskDefinition \
            | jq --arg c "$CONTAINER" '.containerDefinitions |= map(if .name == $c then del(.command) else . end)' \
            > task-definition.json
      - if: steps.entry.outputs.ready == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ steps.ecr.outputs.registry }}/ferry-central-${{ matrix.component }}:${{ github.sha }}
      - if: steps.entry.outputs.ready == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ferry-cluster-${{ env.ENVIRONMENT }}
          service: ${{ env.FAMILY }}
          wait-for-service-stability: true
          wait-for-minutes: 15
