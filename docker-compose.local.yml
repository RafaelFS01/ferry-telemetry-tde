# Orquestração local (paridade Dev/Prod) — SCRUM-11
#
# Uso:
#   cp .env.example .env
#   docker compose -f docker-compose.local.yml up --build
#
# Ordem de inicialização garantida por healthchecks:
#   postgres + localstack (healthy) -> ferry-central (healthy); ferry-boat inicia independente.
#
# Pontos de entrada (SCRUM-20):
#   http://localhost:8080  Borda do Barco   (/ painel, /api/edge/ API NestJS)
#   http://localhost:8081  Borda da Central (/ dashboard, /api/ API Python)

name: ferry-telemetry

x-aws-local: &aws-local
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://localstack:4566

x-nginx-env: &nginx-env
  NGINX_RESOLVER: 127.0.0.11
  # Next.js em modo dev usa eval no HMR; em produção esta variável fica vazia
  CSP_SCRIPT_EXTRA: "'unsafe-eval'"

x-nginx-base: &nginx-base
  image: nginx:1.27-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferry_local}
      POSTGRES_DB: postgres
      TELEMETRY_DB: ${TELEMETRY_DB:-ferry_telemetry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do Postgres 18 o PGDATA fica em /var/lib/postgresql/18/docker
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${TELEMETRY_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  localstack:
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.9}
    restart: unless-stopped
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      # Só fica healthy depois que o script de init criou a última fila
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name ferry-alerts-queue >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  ferry-central:
    build:
      context: ./ferry-central
      dockerfile: ../docker/dev/central.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      <<: *aws-local
      GRPC_PORT: 50051
      REST_ENABLED: "true"
      REST_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ferry}:${POSTGRES_PASSWORD:-ferry_local}@postgres:5432/${TELEMETRY_DB:-ferry_telemetry}
      SNS_TOPIC_ARN: arn:aws:sns:${AWS_REGION:-us-east-1}:000000000000:ferry-telemetria-topic
      SQS_DB_WRITER_QUEUE_URL: ${SQS_DB_WRITER_QUEUE_URL:-http://localstack:4566/000000000000/ferry-db-writer-queue}
      SQS_ALERTS_QUEUE_URL: ${SQS_ALERTS_QUEUE_URL:-http://localstack:4566/000000000000/ferry-alerts-queue}
    ports:
      - "50051:50051"
      - "8000:8000"
    volumes:
      # Bind mount do código para hot-reload
      - ./ferry-central:/app
      - ./proto:/proto:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 50051), 2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  ferry-worker:
    build:
      context: ./ferry-central
      dockerfile: ../docker/dev/central.Dockerfile
    restart: unless-stopped
    command: ["watchfiles", "--filter", "python", "python -m src.worker.main", "src"]
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      <<: *aws-local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ferry}:${POSTGRES_PASSWORD:-ferry_local}@postgres:5432/${TELEMETRY_DB:-ferry_telemetry}
      SQS_QUEUE_URL: ${SQS_DB_WRITER_QUEUE_URL:-http://localstack:4566/000000000000/ferry-db-writer-queue}
      SQS_DLQ_URL: ${SQS_DLQ_URL:-http://localstack:4566/000000000000/ferry-db-writer-queue-dlq}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-50}
      WORKER_BATCH_TIMEOUT_SECONDS: ${WORKER_BATCH_TIMEOUT_SECONDS:-2.0}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
    volumes:
      - ./ferry-central:/app
      - ./proto:/proto:ro

  ferry-boat:
    build:
      context: ./ferry-boat
      dockerfile: ../docker/dev/boat.Dockerfile
    restart: unless-stopped
    environment:
      BOAT_ID: ${BOAT_ID:-ferry-ivete-sangalo}
      CENTRAL_GRPC_URL: ferry-central:50051
      TELEMETRY_INTERVAL_MS: 5000
      GRPC_DEADLINE_MS: ${GRPC_DEADLINE_MS:-2500}
      GRPC_RETRY_MAX_ATTEMPTS: ${GRPC_RETRY_MAX_ATTEMPTS:-6}
      BUFFER_ENABLED: ${BUFFER_ENABLED:-true}
      BUFFER_MAX_ITEMS: ${BUFFER_MAX_ITEMS:-5000}
      BUFFER_BACKUP_PATH: ${BUFFER_BACKUP_PATH:-/app/data/telemetry-buffer.sqlite}
      BUFFER_DRAIN_INTERVAL_MS: ${BUFFER_DRAIN_INTERVAL_MS:-20}
      BUFFER_RETRY_INTERVAL_MS: ${BUFFER_RETRY_INTERVAL_MS:-5000}
      API_PORT: 3002
    ports:
      - "3002:3002"
    volumes:
      - ./ferry-boat:/app
      - ./proto:/proto:ro
      # node_modules isolado do host (evita binários do Windows/macOS no container)
      - boat-node-modules:/app/node_modules
      # Banco SQLite e WAL do buffer sobrevivem a reinicios do container
      - boat-buffer:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3002,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s

  # Painel Tátil do Capitão (SCRUM-21): Next.js 16 em modo dev com hot-reload
  captain-panel:
    build:
      context: ./ferry-boat/frontend
      dockerfile: ../../docker/dev/frontend.Dockerfile
    restart: unless-stopped
    environment:
      # Usado só pelo rewrite do Next quando acessado direto em :3000 (sem o Nginx)
      EDGE_API_URL: http://ferry-boat:3002
    ports:
      - "3000:3000"
    volumes:
      - ./ferry-boat/frontend:/app
      - captain-panel-node-modules:/app/node_modules
      - captain-panel-next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # Borda do Nó Barco: Painel do Capitão (/) e API local do NestJS (/api/edge/)
  nginx-edge:
    <<: *nginx-base
    environment:
      <<: *nginx-env
      CAPTAIN_PANEL_UPSTREAM: http://captain-panel:3000
      EDGE_API_UPSTREAM: http://ferry-boat:3002
    ports:
      - "${NGINX_EDGE_PORT:-8080}:80"
    volumes:
      - ./docker/nginx-edge.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro

  # Borda do Nó Central: Dashboard (/) e API REST Python (/api/)
  nginx-central:
    <<: *nginx-base
    environment:
      <<: *nginx-env
      DASHBOARD_UPSTREAM: http://dashboard:3000
      CENTRAL_API_UPSTREAM: http://ferry-central:8000
    ports:
      - "${NGINX_CENTRAL_PORT:-8081}:80"
    volumes:
      - ./docker/nginx-central.conf:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro

volumes:
  postgres-data:
  localstack-data:
  boat-node-modules:
  boat-buffer:
  captain-panel-node-modules:
  captain-panel-next:
